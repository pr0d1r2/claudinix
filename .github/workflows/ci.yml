# The gate, run exactly the way it runs locally: `nix develop` supplies the
# toolchain pinned in flake.lock, and `hk check` runs the steps defined in
# hk.pkl (SPEC V22). This file installs no linters of its own.
#
# On the default branch it also fills the binary cache that cloud sessions
# substitute from (SPEC C19), then proves the push in a separate job: a
# push step that exits 0 is not evidence that anything arrived.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository, so read is the whole requirement.
permissions:
  contents: read

# A newer push makes the older run's verdict worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    # x86_64-linux on Ubuntu 24.04: the same system and release as the cloud
    # session VM (SPEC C1). Pinned, not `ubuntu-latest`, which moves to
    # Ubuntu 26 from 2026-10-19 and would drift away from the sessions.
    runs-on: ubuntu-24.04
    steps:
      # Actions pinned to commit SHAs; tags are mutable. `fetch-depth: 0`
      # because tdd-order reads history; `persist-credentials: false`
      # because nothing here pushes to git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      # Pushes on a push to the default branch only, and only that event
      # sees the write token (SPEC T74). Pull requests and manual runs
      # still read the cache; they cannot fill it.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: pr0d1r2
          authToken: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

      # `--check`: CI reports, never rewrites. `--no-fail-fast`: a round
      # trip costs minutes, so report every failure at once.
      - run: nix develop --command hk check --all --check --no-fail-fast

      # `--all-systems`: the bare form skips other systems silently.
      - run: nix flake check --all-systems

      # The dev shell and the agent home (nix:T18), so their output paths
      # are pushed and verifiable. Cloud sessions substitute the agent
      # home from the cache (nix:V15).
      - run: nix build --no-link .#devShells.x86_64-linux.default .#homeConfigurations.cloud.activationPackage

      # The daemon above pushes only built paths. A cloud session also
      # evaluates every input of the agent home and the dev shell before
      # it builds, so their sources go to the cache too (SPEC T74, V30).
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/ci/push-sources.sh pr0d1r2

  verify-cache:
    name: verify cache
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      # The dev shell, the agent home and every eval-time input source.
      # The xenolith check's output is an empty marker no session needs.
      - run: bash scripts/ci/verify-cachix.sh --sources . .#devShells.x86_64-linux.default .#homeConfigurations.cloud.activationPackage
